name: Release credential safety

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # actionlint does not model GitHub's queue field yet. The Node suite
      # below checks both release concurrency mappings, including queue: max.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore '^unexpected key "queue" for "concurrency" section\.' .github/workflows/*.yml
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix .github
      - run: node --test .github/scripts/*.test.cjs
