name: Release credential safety

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
