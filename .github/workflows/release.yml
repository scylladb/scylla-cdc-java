name: Release scylla-cdc-java

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: master, or a tag whose preceding commit passes release configuration checks. Other branches and unsafe historical targets are unsupported.'
        default: master

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

permissions:
  contents: read

concurrency:
  group: cdc-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Check release branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Releases must be dispatched from master."
            exit 1
          fi

      - name: Checkout validation source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Block release with open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Set up validation Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'

      # Maven 3.10 adds repository metadata to the Central publishing bundle.
      # Sonatype rejects the resulting bundle; see apache/maven#13388.
      - name: Set up Maven 3.9.16
        run: |
          bash scripts/release/setup-maven.sh

      - name: Validate release tooling
        run: |
          python3 scripts/release/guard.py check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Preserve validation tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tooling"
          cp Makefile scripts/release/*.py scripts/release/*.sh scripts/release/publisher.asc "$RUNNER_TEMP/release-tooling/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-tooling/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_HELPER=$RUNNER_TEMP/release-tooling/signing.py" >> "$GITHUB_ENV"
          echo "RELEASE_MAKEFILE=$RUNNER_TEMP/release-tooling/Makefile" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Record validated commit
        id: target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          if [[ "$RELEASE_TARGET_TAG" != master ]]; then
            git check-ref-format "refs/tags/$RELEASE_TARGET_TAG"
            git checkout --detach "refs/tags/$RELEASE_TARGET_TAG~1"
          fi
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"

      - name: Validate target without release credentials
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          make -f "$RELEASE_MAKEFILE" release-validate RELEASE_DEFER_LOGS=true

      - name: Scan validation logs
        if: always()
        run: |
          if [[ -n "${RELEASE_MAKEFILE:-}" && -f "$RELEASE_MAKEFILE" ]]; then
            make -f "$RELEASE_MAKEFILE" release-report
          fi

      - name: Upload sanitized validation stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: |
            ${{ runner.temp }}/release-logs/stdout.log
            ${{ runner.temp }}/release-logs/log-report.txt
          if-no-files-found: ignore

      - name: Upload sanitized validation stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    # Approval is requested only after validation succeeds on a separate runner.
    # Owners must provision protection and environment secrets before releasing.
    environment: release

    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tooling"
          cp Makefile scripts/release/*.py scripts/release/*.sh scripts/release/publisher.asc "$RUNNER_TEMP/release-tooling/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-tooling/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_HELPER=$RUNNER_TEMP/release-tooling/signing.py" >> "$GITHUB_ENV"
          echo "RELEASE_MAKEFILE=$RUNNER_TEMP/release-tooling/Makefile" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Checkout validated target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Releases must be dispatched from master."
            exit 1
          fi
          [[ "$RELEASE_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$RELEASE_TARGET_COMMIT"
          if [[ "$RELEASE_TARGET_TAG" == master ]]; then
            git fetch --no-tags origin master
            current_master=$(git rev-parse FETCH_HEAD)
            if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
              echo "master advanced after validation; start a new release workflow."
              exit 1
            fi
            git checkout -B master "$RELEASE_TARGET_COMMIT"
          else
            git checkout --detach "$RELEASE_TARGET_COMMIT"
          fi

      - name: Check release configuration before importing credentials
        run: python3 "$RELEASE_GUARD" check

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD

      # Maven 3.10 adds repository metadata to the Central publishing bundle.
      # Sonatype rejects the resulting bundle; see apache/maven#13388.
      - name: Set up Maven 3.9.16
        run: |
          bash "$RUNNER_TEMP/release-tooling/setup-maven.sh"

      - name: Check publishing credentials before signing preparation
        env:
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: python3 "$RUNNER_TEMP/release-tooling/credentials.py"

      - name: Prepare release
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: 'true'
          RELEASE_VERSION: ${{ inputs.release-version }}
          IS_CICD: true
        run: |
          baseline=$(git rev-parse HEAD)
          export RELEASE_BASE_COMMIT="$baseline"
          echo "RELEASE_BASE_COMMIT=$baseline" >> "$GITHUB_ENV"
          make -f "$RELEASE_MAKEFILE" ci-release-prepare RELEASE_DEFER_LOGS=true

      - name: Verify prepared release commits and tag with public key only
        run: python3 "$RELEASE_SIGNING_HELPER" verify-prepared

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Recheck validated master before publication
        if: inputs.target-tag == 'master'
        env:
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          git fetch --no-tags origin master
          current_master=$(git rev-parse FETCH_HEAD)
          if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
            echo "master advanced after validation; start a new release workflow."
            exit 1
          fi

      - name: Perform release
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_SKIP_TESTS: 'true'
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          IS_CICD: true
        run: |
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            make -f "$RELEASE_MAKEFILE" ci-release-dry-run RELEASE_DEFER_LOGS=true
          else
            make -f "$RELEASE_MAKEFILE" ci-release RELEASE_DEFER_LOGS=true
          fi

      - name: Push changes to SCM
        id: scm_push
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git status && git log -3
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f' \
            push origin --follow-tags -v HEAD:refs/heads/master

      - name: Preserve signed history after failed SCM push
        if: ${{ failure() && steps.scm_push.outcome == 'failure' }}
        run: |
          recovery="$RUNNER_TEMP/release-recovery"
          mkdir -p "$recovery"
          tag=$(sed -n 's/^scm.tag=//p' release.properties)
          git check-ref-format "refs/tags/$tag"
          git bundle create "$recovery/history.bundle" HEAD "refs/tags/$tag"
          git rev-parse --verify "$RELEASE_BASE_COMMIT^{commit}" > "$recovery/baseline"
          git rev-parse HEAD > "$recovery/head"
          printf '%s\n' "$tag" > "$recovery/release-tag"

      - name: Upload signed recovery history
        if: ${{ failure() && steps.scm_push.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-recovery
          path: ${{ runner.temp }}/release-recovery/
          if-no-files-found: error
          retention-days: 30

      - name: Scan release logs
        if: always()
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          if [[ -n "${RELEASE_MAKEFILE:-}" && -f "$RELEASE_MAKEFILE" ]]; then
            make -f "$RELEASE_MAKEFILE" release-report
          fi

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: |
            ${{ runner.temp }}/release-logs/stdout.log
            ${{ runner.temp }}/release-logs/log-report.txt
          if-no-files-found: ignore

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
