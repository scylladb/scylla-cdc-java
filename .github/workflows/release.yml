name: Release

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: re-release a compatible scylla-cdc-X.Y.Z tag; unsafe historical targets are rejected'
        default: master

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

permissions: {}

jobs:
  validate:
    name: Pre-release checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.target-sha }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-blockers.sh

      - name: Validate release target
        id: target
        uses: ./.github/actions/release-validate
        with:
          target-tag: ${{ inputs.target-tag }}
          release-version: ${{ inputs.release-version }}
          skip-tests: ${{ inputs.skip-tests }}

      - name: Recheck for open release blockers before approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-tooling/check-blockers.sh"

      - name: Summarize pre-release checks
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pre-release checks passed

          Release inputs, tooling, target policy, and the unsigned release build passed.
          Project tests ran unless skip-tests was selected.

          The Release job now requires approval for the protected release environment.
          Signing and publishing credentials are only used after approval.
          EOF

      - name: Upload sanitized validation-stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized validation-stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    # Let pre-release checks run independently; serialize only credentialed work.
    # Never cancel an in-progress signing or publishing job.
    concurrency:
      group: cdc-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-blockers.sh

      - name: Prepare signed release
        uses: ./.github/actions/release-prepare
        with:
          target-tag: ${{ inputs.target-tag }}
          target-sha: ${{ needs.validate.outputs.target-sha }}
          release-version: ${{ inputs.release-version }}
          signing-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          sonatype-token-username: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          sonatype-token-password: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}

      - name: Upload signed history and public recovery metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-recovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery/
          if-no-files-found: ignore
          retention-days: 7

      - name: Recheck for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-tooling/check-blockers.sh"

      - name: Recheck validated master before publication
        if: inputs.target-tag == 'master'
        env:
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          git fetch --no-tags origin master
          current_master=$(git rev-parse FETCH_HEAD)
          if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
            echo "master advanced after validation; start a new release workflow."
            exit 1
          fi

      - name: Perform release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RELEASE_MAKEFILE" ci-release

      - name: Push changes to SCM
        if: inputs.target-tag == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git status && git log -3
          # The helper expands GH_TOKEN only when Git asks for credentials.
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f' \
            push origin --follow-tags -v HEAD:refs/heads/master

      - name: Sign and verify GitHub assets
        if: inputs.target-tag == 'master'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 "$RUNNER_TEMP/release-tooling/assets.py" sign

      - name: Create GitHub Release
        if: inputs.target-tag == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -f "$RELEASE_MAKEFILE" ci-github-release

      - name: Upload built release artifacts for recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-built-artifacts-${{ github.run_attempt }}
          path: |
            target/checkout/scylla-cdc-base/target/*.jar*
            target/checkout/scylla-cdc-lib/target/*.jar*
            target/checkout/scylla-cdc-driver3/target/*.jar*
            target/checkout/scylla-cdc-replicator/target/fat-jar/*.jar*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
          retention-days: 7
