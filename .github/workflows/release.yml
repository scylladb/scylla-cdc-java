name: Release scylla-cdc-java

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

permissions:
  contents: read

concurrency:
  group: cdc-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Check release branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Releases must be dispatched from master."
            exit 1
          fi

      - name: Checkout validation source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Block release with open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Set up validation Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'

      # Maven 3.10 adds repository metadata to the Central publishing bundle.
      # Sonatype rejects the resulting bundle; see apache/maven#13388.
      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          maven_version=3.9.16
          archive="$RUNNER_TEMP/apache-maven-${maven_version}-bin.tar.gz"
          curl --fail --location --silent --show-error \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${maven_version}/apache-maven-${maven_version}-bin.tar.gz" \
            --output "$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${maven_version}/bin" >> "$GITHUB_PATH"

      - name: Validate release tooling
        run: |
          python3 scripts/release/guard.py check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Record validated commit
        id: target
        run: git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"

      - name: Validate target without release credentials
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
        run: |
          python3 scripts/release/guard.py check
          if [[ "$RELEASE_SKIP_TESTS" == true ]]; then
            export MAVEN_OPTS="${MAVEN_OPTS:-} -DskipTests=true -DskipITs=true"
          fi
          python3 scripts/release/guard.py run mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true verify

      - name: Upload sanitized validation stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore

      - name: Upload sanitized validation stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    # Approval is requested only after validation succeeds on a separate runner.
    # Owners must provision protection and environment secrets before releasing.
    environment: release

    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.target-sha }}
          fetch-depth: 0

      - name: Check validated master
        env:
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Releases must be dispatched from master."
            exit 1
          fi
          [[ "$RELEASE_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin master
          current_master=$(git rev-parse FETCH_HEAD)
          if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
            echo "master advanced after validation; start a new release workflow."
            exit 1
          fi
          git checkout -B master "$RELEASE_TARGET_COMMIT"

      - name: Check release credential safety before importing credentials
        run: python3 scripts/release/guard.py check

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD

      # Maven 3.10 adds repository metadata to the Central publishing bundle.
      # Sonatype rejects the resulting bundle; see apache/maven#13388.
      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          maven_version=3.9.16
          archive="$RUNNER_TEMP/apache-maven-${maven_version}-bin.tar.gz"
          curl --fail --location --silent --show-error \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${maven_version}/apache-maven-${maven_version}-bin.tar.gz" \
            --output "$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${maven_version}/bin" >> "$GITHUB_PATH"

      - name: Check publishing credentials before signing preparation
        env:
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: python3 scripts/release/credentials.py

      - name: Prepare release
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: 'true'
          RELEASE_VERSION: ${{ inputs.release-version }}
          IS_CICD: true
        run: |
          baseline=$(git rev-parse HEAD)
          export RELEASE_BASE_COMMIT="$baseline"
          echo "RELEASE_BASE_COMMIT=$baseline" >> "$GITHUB_ENV"
          make ci-release-prepare

      - name: Verify prepared release commits and tag with public key only
        run: python3 scripts/release/signing.py verify-prepared

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Perform release
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_SKIP_TESTS: 'true'
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          IS_CICD: true
        run: |
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            make ci-release-dry-run
          else
            make ci-release
          fi

      - name: Push changes to SCM
        if: inputs.dry-run == false
        run: |
          git status && git log -3
          git push origin --follow-tags -v HEAD:refs/heads/master

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
