name: Release scylla-cdc-java

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to to re-release failed releases'
        default: master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read

    env:
      MVNCMD: mvn -B -ntp

    steps:
      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "${blocker}" ]]; then
            blocker_title=$(jq -r '.title' <<< "${blocker}")
            blocker_url=$(jq -r '.url' <<< "${blocker}")
            echo "::error title=Release blocked::${blocker_title} (${blocker_url})"
            echo "Open release blocker: ${blocker_title} (${blocker_url})"
            exit 1
          fi
          echo "No open release blockers found."

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Preserve repository signing policy
        run: |
          mkdir -m 700 "$RUNNER_TEMP/release-signing-policy"
          cp scripts/release/signing.py scripts/release/publisher.asc "$RUNNER_TEMP/release-signing-policy/"
          echo "RELEASE_SIGNING_HELPER=$RUNNER_TEMP/release-signing-policy/signing.py" >> "$GITHUB_ENV"

      - name: Preserve release guard
        run: |
          mkdir -p "$RUNNER_TEMP/release-safety"
          cp scripts/release/*.py "$RUNNER_TEMP/release-safety/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-safety/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Checkout release target
        if: inputs.target-tag != 'master'
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          git fetch --prune --unshallow || git fetch --prune
          git checkout "refs/tags/$RELEASE_TARGET_TAG~1"
          git tag -d "$RELEASE_TARGET_TAG"

      - name: Check release credential safety before importing credentials
        run: python3 "$RUNNER_TEMP/release-safety/guard.py" check

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD

      # Maven 3.10 adds repository metadata to the Central publishing bundle.
      # Sonatype rejects the resulting bundle; see apache/maven#13388.
      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          maven_version=3.9.16
          archive="$RUNNER_TEMP/apache-maven-${maven_version}-bin.tar.gz"
          curl --fail --location --silent --show-error \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${maven_version}/apache-maven-${maven_version}-bin.tar.gz" \
            --output "$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${maven_version}/bin" >> "$GITHUB_PATH"

      - name: Configure protected repository signing subkey
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 "$RELEASE_SIGNING_HELPER" configure

      - name: Clean project
        run: python3 "$RELEASE_GUARD" run $MVNCMD clean

      - name: Clean release
        run: python3 "$RELEASE_GUARD" run $MVNCMD release:clean

      - name: Prepare release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export MAVEN_OPTS="${MAVEN_OPTS:-} $RELEASE_MAVEN_OPTS"
          if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
            MAVEN_OPTS="${MAVEN_OPTS} -DskipTests=true -DskipITs=true"
          fi
          export MAVEN_OPTS
          python3 "$RELEASE_GUARD" run $MVNCMD release:prepare -DpushChanges=false

      - name: Verify prepared release commits and tag with public key only
        run: python3 "$RELEASE_SIGNING_HELPER" verify-prepared

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "${blocker}" ]]; then
            blocker_title=$(jq -r '.title' <<< "${blocker}")
            blocker_url=$(jq -r '.url' <<< "${blocker}")
            echo "::error title=Release blocked::${blocker_title} (${blocker_url})"
            echo "Open release blocker: ${blocker_title} (${blocker_url})"
            exit 1
          fi
          echo "No open release blockers found."

      - name: Perform release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          export MAVEN_OPTS="${MAVEN_OPTS:-} $RELEASE_MAVEN_OPTS"
          CMD_OPTS=""
          if [[ "${{ inputs.dry-run }}" != "true" ]]; then
            CMD_OPTS="-Drelease.autopublish=true"
          fi
          if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
            MAVEN_OPTS="${MAVEN_OPTS} -DskipTests=true -DskipITs=true"
          fi
          export MAVEN_OPTS
          python3 "$RELEASE_GUARD" run $MVNCMD release:perform $CMD_OPTS

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'master' }}
        run: |
          git status && git log -3
          git push origin --follow-tags -v

      - name: Upload sanitized release logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-release-logs
          path: ${{ runner.temp }}/release-logs/*.log
          if-no-files-found: ignore

      - name: Remove temporary release signing files
        if: always() && env.RELEASE_SIGNING_DIR != ''
        run: python3 "$RELEASE_SIGNING_HELPER" cleanup
