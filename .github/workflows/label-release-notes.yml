name: Classify release notes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to classify, including merged PRs
        required: true
        type: number

permissions: {}

concurrency:
  group: release-notes-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  classify:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          pr-number: ${{ github.event.pull_request.number || inputs.pull-request }}
