name: Validate release
description: Validate inputs, tooling and the unsigned target before credential approval
inputs:
  target-tag:
    description: Source target (master or a compatible scylla-cdc-X.Y.Z tag)
    required: true
  release-version:
    description: Optional release version override (X.Y.Z)
    required: false
    default: ''
  skip-tests:
    description: Skip project tests during validation (release helper tests always run)
    required: false
    default: 'false'
outputs:
  target-sha:
    description: Exact commit that passed validation
    value: ${{ steps.target.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Check release branch
      shell: bash
      run: |
        if [[ "$GITHUB_REF" != refs/heads/master ]]; then
          echo "Releases must be dispatched from master."
          exit 1
        fi
    - name: Validate release inputs
      env:
        RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        RELEASE_VERSION: ${{ inputs.release-version }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RELEASE_TARGET_TAG" != master && ! "$RELEASE_TARGET_TAG" =~ ^scylla-cdc-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Unsupported target tag; expected master or scylla-cdc-X.Y.Z"
          exit 1
        fi
        if [[ -n "$RELEASE_VERSION" && ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release version must be X.Y.Z"
          exit 1
        fi
        if [[ "$RELEASE_TARGET_TAG" != master && -n "$RELEASE_VERSION" && "scylla-cdc-$RELEASE_VERSION" != "$RELEASE_TARGET_TAG" ]]; then
          echo "::error::Historical recovery must retain the requested release version."
          exit 1
        fi
    - name: Check master before validation
      if: inputs.target-tag == 'master'
      env:
        RELEASE_TARGET_COMMIT: ${{ github.sha }}
      shell: bash
      run: |
        git fetch --no-tags origin master
        current_master=$(git rev-parse FETCH_HEAD)
        if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
          echo "master advanced before validation; start a new release workflow."
          exit 1
        fi
    - name: Set up validation Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '11'
        distribution: 'temurin'

    # Maven 3.10 adds repository metadata to the Central publishing bundle.
    # Sonatype rejects the resulting bundle; see apache/maven#13388.
    - name: Set up Maven 3.9.16
      shell: bash
      run: bash scripts/release/setup-maven.sh
    - name: Validate release tooling
      shell: bash
      run: |
        python3 scripts/release/guard.py check
        python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
    - name: Preserve validation tooling
      shell: bash
      run: bash scripts/release/preserve-tools.sh
    - name: Record validated commit
      id: target
      env:
        RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        RELEASE_WORKFLOW_COMMIT: ${{ github.sha }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RELEASE_TARGET_TAG" != master ]]; then
          git check-ref-format "refs/tags/$RELEASE_TARGET_TAG"
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TARGET_TAG^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" "$RELEASE_WORKFLOW_COMMIT"; then
            echo "Historical release tag is outside the workflow's trusted master history."
            exit 1
          fi
          git checkout --detach "$tag_commit~1"
        fi
        git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
    - name: Validate target without release credentials
      env:
        RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
      shell: bash
      run: |
        python3 "$RELEASE_GUARD" check
        if [[ "$RELEASE_SKIP_TESTS" == true ]]; then
          export MAVEN_OPTS="${MAVEN_OPTS:-} -DskipTests=true -DskipITs=true"
        fi
        python3 "$RELEASE_GUARD" run mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true verify
    - name: Recheck master before approval
      if: inputs.target-tag == 'master'
      env:
        RELEASE_TARGET_COMMIT: ${{ steps.target.outputs.sha }}
      shell: bash
      run: |
        git fetch --no-tags origin master
        current_master=$(git rev-parse FETCH_HEAD)
        if [[ "$current_master" != "$RELEASE_TARGET_COMMIT" ]]; then
          echo "master advanced after validation; start a new release workflow."
          exit 1
        fi
